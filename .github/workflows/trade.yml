name: paper-trade

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 min (GitHub may drift a few minutes — fine for 1h candles)
  workflow_dispatch: {}       # manual "Run workflow" button

permissions:
  contents: write

concurrency:
  group: trade
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Run one trading cycle
        run: python main.py auto-once BTC_USD

      - name: Commit portfolio state
        run: |
          git config user.name "paper-trade-bot"
          git config user.email "bot@users.noreply.github.com"
          git add portfolio.json
          git diff --cached --quiet || git commit -m "trade cycle $(date -u +%FT%TZ)"
          git pull --rebase
          git push
