name: paper-trade

on:
  schedule:
    - cron: "*/5 * * * *"    # every 5 min — GitHub's minimum; treated as best-effort so expect some drift
  workflow_dispatch: {}       # manual "Run workflow" button

permissions:
  contents: write

concurrency:
  group: trade
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Run one trading cycle
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py auto-once BTC_USD

      - name: Commit portfolio state
        run: |
          git config user.name "paper-trade-bot"
          git config user.email "bot@users.noreply.github.com"
          # weekly heartbeat: keeps the repo active so GitHub never freezes the cron
          # (scheduled workflows auto-disable after 60 days without commits)
          if [ "$(date -u +%u%H)" = "112" ]; then date -u +%F > .heartbeat; fi
          git add portfolio.json lever_portfolio.json .heartbeat
          git diff --cached --quiet || git commit -m "trade cycle $(date -u +%FT%TZ)"
          git pull --rebase
          git push
